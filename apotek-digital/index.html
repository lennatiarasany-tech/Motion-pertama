     dari scene.html + assets/mesin/core.html. Jangan edit index.html langsung: edit scene.html lalu rakit ulang.
     Buka di browser: autoplay + loop. ?debug=1 = penggeser waktu · ?t=4.2 = berhenti di detik 4,2 ·
     ?clean=1 = diam untuk render. Tombol: R = ulang, Spasi = jeda. -->

<style>
#stage{background:#3163D1;--biru:#3163D1;--biruT:#2C5AAE;--teal:#4DA39A;--hijau:#5DAD72;--navy:#1F2D3D;--kuning:#FFE14D;--merah:#FF4F64;--krem:#FFFDF5}

.abs{position:absolute}
/* latar */
#bg{position:absolute;left:-200px;top:-200px;width:1480px;height:2320px;overflow:hidden}
#b1{position:absolute;inset:0;background:var(--biru)}
#dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.17) 3px,transparent 3.6px);background-size:26px 26px}
#ring{position:absolute;width:520px;height:520px;border-radius:50%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.15) 0 18px,transparent 18px 44px)}

#b3{position:absolute;left:-300px;width:2200px;height:56px;background:var(--hijau);transform-origin:0 0}

#hp{position:absolute;left:300px;top:640px;width:500px;height:990px;border-radius:72px;background:var(--navy);padding:22px;box-shadow:30px 30px 0 rgba(31,45,61,.45)}
#layar{position:relative;width:100%;height:100%;border-radius:54px;background:#EEF2FA;overflow:hidden}
#statusbar{position:absolute;left:40px;right:40px;top:22px;display:flex;justify-content:space-between;font:800 24px 'Plus Jakarta Sans';color:var(--navy)}
#poni{position:absolute;left:50%;top:18px;width:120px;height:34px;margin-left:-60px;border-radius:20px;background:var(--navy)}
#appbar{position:absolute;left:28px;right:28px;top:78px;display:flex;align-items:center;justify-content:space-between;font:800 34px 'Plus Jakarta Sans';color:var(--navy)}
#badge{background:var(--merah);color:#fff;font:800 28px 'Plus Jakarta Sans';padding:4px 18px;border-radius:30px}
.not{position:absolute;left:24px;right:24px;background:#fff;border-radius:26px;padding:20px 20px;box-shadow:0 6px 0 #D2DBEC;display:flex;gap:16px;align-items:center;font:800 29px/1.15 'Plus Jakarta Sans';color:var(--navy)}
.not small{display:block;font:600 23px/1.3 'Plus Jakarta Sans';color:#6B7890}
.ic{flex:none;width:62px;height:62px;border-radius:18px;background:var(--merah);color:#fff;font:800 40px/62px 'Plus Jakarta Sans';text-align:center}
.ic.k{background:#FFB020}
/* kertas nota */
.nota{position:absolute;width:230px;height:150px;background:var(--krem);border:5px solid var(--navy);border-radius:10px;box-shadow:8px 8px 0 var(--navy);padding:24px}
.nota i{display:block;height:11px;background:#D9D3BD;margin-bottom:16px;border-radius:5px}
/* stiker */
.stk{position:absolute;font:400 60px/1 'Bagel Fat One';padding:20px 32px;border-radius:26px;border:6px solid var(--navy);box-shadow:10px 10px 0 var(--navy);white-space:nowrap}
/* kartu banding */
.kartu{position:absolute;top:640px;width:430px;height:560px;border-radius:44px;background:#fff;border:8px solid var(--navy);box-shadow:18px 18px 0 var(--navy);text-align:center;padding-top:44px}
.kartu .lb{font:800 50px 'Plus Jakarta Sans';color:var(--navy);letter-spacing:.02em}
.kartu .ang{font:400 300px/1.05 'Bagel Fat One';color:var(--navy)}
.kartu .ik{margin:0 auto;width:120px;height:92px;position:relative}
#vs{position:absolute;left:540px;top:900px;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;background:var(--kuning);border:7px solid var(--navy);box-shadow:8px 8px 0 var(--navy);font:400 92px/138px 'Bagel Fat One';color:var(--navy);text-align:center}
/* teks besar (di luar kamera, tetap terbaca) */
#teks{position:absolute;inset:0;pointer-events:none}
.big{position:absolute;left:70px;font:400 172px/1 'Bagel Fat One';color:#fff;text-shadow:16px 16px 0 var(--navy);white-space:nowrap;transform-origin:20% 60%}
.big.k{color:var(--kuning)}
#blk{position:absolute;left:70px;top:590px;font:400 96px/1 'Bagel Fat One';color:#fff;background:var(--navy);padding:22px 30px 18px;box-shadow:16px 16px 0 var(--hijau);white-space:nowrap;transform-origin:0 50%}
#tanya{position:absolute;left:0;right:0;top:250px;text-align:center;font:400 128px/1.02 'Bagel Fat One';color:#fff;text-shadow:14px 14px 0 var(--navy)}
#tanya span{color:var(--kuning)}
#mfSub{z-index:90}
#mfSub .sf>span{background:#1F2D3D!important;box-shadow:8px 8px 0 rgba(0,0,0,.25)}
#sapu{position:absolute;z-index:95;left:-400px;top:-300px;width:2400px;height:2600px;background:var(--navy);transform-origin:0 0}
</style>
<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="kata.js" onerror="window.KATA=window.KATA||null"></script>
<script>
/* ================= MESIN MOTION FORMAT =================
   Aturan emas: semua gerak adalah fungsi dari waktu t (detik). Jangan pakai Date, performance.now,
   requestAnimationFrame, setTimeout, atau Math.random tanpa benih: render MP4 = lompat ke tiap frame. */
window.__errs=[];addEventListener('error',e=>__errs.push(String(e.message)));addEventListener('unhandledrejection',e=>__errs.push('Promise: '+String(e.reason&&e.reason.stack||e.reason)));
const W=1080,H=1920,RASIO='9:16',TEGAK=H>W,q=new URLSearchParams(location.search);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- matematika kecil ---------- */
const lerp=(a,b,k)=>a+(b-a)*k,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k);};
const seg=(t,a,b)=>clamp((t-a)/(b-a));                 // 0..1 di rentang [a,b]
const E={lin:k=>k,out:k=>1-Math.pow(1-k,3),in:k=>k*k*k,io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  s:k=>k*k*(3-2*k),ox:k=>k>=1?1:1-Math.pow(2,-10*k),
  back:k=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);},
  pegas:k=>k>=1?1:1-Math.exp(-6*k)*Math.cos(12*k)};
const nz=(t,s=0)=>Math.sin(t*1.31+s*7.13)*.5+Math.sin(t*2.71+s*3.37)*.3+Math.sin(t*.613+s*1.71)*.2; // goyang halus -1..1
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=n=>{const s=Math.sin(n*127.1+31.7)*43758.5453;return s-Math.floor(s);};

/* ---------- DOM & SVG ---------- */
function mk(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||$('#stage')).appendChild(e);return e;}
function svgEl(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function kanvas(w=W,h=H,parent){const c=document.createElement('canvas');c.width=w;c.height=h;if(parent){c.style.cssText=`position:absolute;left:0;top:0;width:${w}px;height:${h}px`;parent.appendChild(c);}return c;}

/* ---------- teks per kata: masuk/keluar dengan blur berarah ---------- */
function split(el){const out=[];(function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3){const parts=c.textContent.split(/(\s+)/);const frag=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){frag.appendChild(document.createTextNode(' '));return;}const wd=document.createElement('span');wd.className='wd';const wi=document.createElement('span');wi.className='wi';wi.textContent=p;wd.appendChild(wi);frag.appendChild(wd);out.push(wi);});c.replaceWith(frag);}else if(c.nodeType===1&&!c.classList.contains('wd'))walk(c);});})(el);return out;}
const W8=el=>el._w||(el._w=split(el));
function wIn(tl,el,at,o={}){const ws=W8(el);tl.set(el,{autoAlpha:1},at);tl.fromTo(ws,{yPercent:o.y??80,xPercent:o.x??0,opacity:0,filter:`blur(${o.b??12}px)`,scaleY:o.sy??1.25},{yPercent:0,xPercent:0,opacity:1,filter:'blur(0px)',scaleY:1,duration:o.d??.6,ease:o.ease??'power3.out',stagger:o.st??.07},at);return tl;}
function wOut(tl,el,at,o={}){const ws=W8(el);tl.to(ws,{yPercent:o.y??-70,xPercent:o.x??0,opacity:0,filter:`blur(${o.b??10}px)`,duration:o.d??.35,ease:'power2.in',stagger:o.st??.025},at);tl.set(el,{autoAlpha:0},at+(o.d??.35)+ws.length*(o.st??.025));return tl;}

/* ---------- butiran film ---------- */
function grainOn(opacity=.3,blend='overlay'){const c=kanvas(220,220),x=c.getContext('2d'),d=x.createImageData(220,220),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);const g=$('#grain');g.style.backgroundImage=`url(${c.toDataURL()})`;g.style.opacity=opacity;g.style.mixBlendMode=blend;}
function grainFrame(t){const k=Math.floor(t*12);$('#grain').style.transform=`translate(${(k*37)%64-32}px,${(k*53)%64-32}px)`;}

/* ---------- zona aman: tempat teks penting boleh berada ---------- */
const AMAN=TEGAK?{atas:180,bawah:H-300,kiri:70,kanan:W-150}:{atas:70,bawah:H-90,kiri:110,kanan:W-110};

/* ---------- LABEL PENUNJUK: titik + garis + teks, tanpa kotak ----------
   const L=label({x:540,y:900,dx:180,dy:-160,teks:'pompa air',warna:'#FFD27A'});
   di frame(t): L.atur(t, muncul, hilang)            -> garis menggambar, teks masuk
   objek bergerak / 3D: L.atur(t, muncul, hilang, xLayar, yLayar)  -> titik ikut objek, sisi teks dijaga di zona aman */
function label(o){const g=svgEl('g',{opacity:0},$('#mfLab'));const w=o.warna||'#FFE7B0',fs=o.ukuran||(TEGAK?54:44);
  const halo=svgEl('circle',{r:22,fill:w,opacity:.25},g),dot=svgEl('circle',{r:8,fill:w},g);
  const ln=svgEl('polyline',{fill:'none',stroke:w,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  const tt=svgEl('text',{fill:o.warnaTeks||'#FFFFFF','font-size':fs,'font-weight':o.tebal||800,style:'paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:10px;stroke-linejoin:round'},g);tt.textContent=o.teks;
  let len=0,kunci='';
  function tata(x,y){const kk=Math.round(x)+','+Math.round(y);if(kk===kunci)return;kunci=kk;
    const d0=Math.abs(o.dx??160),lebar=fs*.58*String(o.teks).length+56;
    const muatKanan=x+d0+lebar<=AMAN.kanan,muatKiri=x-d0-lebar>=AMAN.kiri;
    let kanan=(o.dx??160)>=0?(muatKanan||!muatKiri&&AMAN.kanan-x>=x-AMAN.kiri):!(muatKiri||!muatKanan&&x-AMAN.kiri>=AMAN.kanan-x);
    let tx=kanan?Math.min(x+d0,AMAN.kanan-lebar):Math.max(x-d0,AMAN.kiri+lebar);   // tak ada sisi lega: siku digeser ke dalam
    const ty=clamp(y+(o.dy??-140),AMAN.atas+fs,AMAN.bawah-fs);
    halo.setAttribute('cx',x);halo.setAttribute('cy',y);dot.setAttribute('cx',x);dot.setAttribute('cy',y);
    ln.setAttribute('points',`${x},${y} ${tx},${ty} ${tx+(kanan?40:-40)},${ty}`);len=Math.hypot(tx-x,ty-y)+40;ln.setAttribute('stroke-dasharray',len);
    tt.setAttribute('x',tx+(kanan?56:-56));tt.setAttribute('y',ty+fs*.35);tt.setAttribute('text-anchor',kanan?'start':'end');}
  tata(o.x??W/2,o.y??H/2);
  return{g,atur(t,a,b=1e9,x,y){if(!tt._f){tt._f=1;tt.setAttribute('font-family',o.font||(SUB.cfg?SUB.cfg.font.replace(/^.*?\d+px\s*/,''):'system-ui,sans-serif'));}
    if(x!=null)tata(x,y);const k=E.out(seg(t,a,a+.5)),h=1-seg(t,b,b+.3);g.setAttribute('opacity',Math.min(1,k*3)*h);
    ln.setAttribute('stroke-dashoffset',len*(1-k));tt.setAttribute('opacity',E.out(seg(t,a+.25,a+.6)));halo.setAttribute('r',22+8*Math.sin(t*4));}};}

const MFlabel=label;   // nama cadangan bila adegan memakai nama `label` sendiri

/* ---------- SUBTITLE dinamis per kata ----------
   Sumber kata: SCENE.kata, atau window.KATA dari kata.js (dibuat `mf.py kata`). Format [{w,t0,t1}] detik layar.
   SCENE.sub = { gaya:'polos'|'pil'|'mati', maks:4, y:0.68 (pecahan tinggi) atau fungsi(t,frasa)->{x,y},
                 font:"800 64px 'Plus Jakarta Sans'", warna:'#fff', aksen:'#FFB547', kunci:['kata','kunci'] } */
const SUB={frasa:[],cfg:null};
function subSiapkan(kata,cfg){SUB.cfg=Object.assign({gaya:'polos',maks:TEGAK?4:6,y:TEGAK?.68:.84,warna:'#FFFFFF',aksen:'#FFB547',kunci:[],
  font:`800 ${TEGAK?64:52}px system-ui,sans-serif`},cfg||{});if(!kata||!kata.length||SUB.cfg.gaya==='mati')return;
  const c=SUB.cfg,box=$('#mfSub');box.style.font=c.font;box.style.color=c.warna;
  if(c.gaya==='pil'){box.style.textShadow='none';}else{box.style.textShadow='0 2px 2px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.75),0 0 40px rgba(0,0,0,.5)';}
  const norm=w=>String(w).toLowerCase().replace(/[^\p{L}\p{N}]/gu,''),kunci=new Set(c.kunci.map(norm));let cur=[];
  const tutup=()=>{if(cur.length)SUB.frasa.push(cur);cur=[];};
  kata.forEach((k,i)=>{const prev=kata[i-1];if(cur.length&&(cur.length>=c.maks||/[.,!?;:…]$/.test(prev.w)||k.t0-prev.t1>.35))tutup();cur.push(k);});tutup();
  SUB.frasa=SUB.frasa.map((ws,i)=>{const el=mk('div','sf',box);el.style.cssText=`position:absolute;left:0;width:100%;opacity:0;padding:0 ${W-AMAN.kanan}px 0 ${AMAN.kiri}px`;
    const inner=c.gaya==='pil'?mk('span','',el):el;if(c.gaya==='pil')inner.style.cssText='display:inline-block;padding:.12em .5em .18em;border-radius:.6em;background:rgba(12,12,20,.72)';
    const spans=ws.map(k=>{const s=mk('span','sw',inner);s.textContent=k.w;if(kunci.has(norm(k.w)))s.style.color=c.aksen;return s;});
    const nxt=kata.indexOf(ws[ws.length-1])+1;const akhir=Math.min(ws[ws.length-1].t1+.35,kata[nxt]?kata[nxt].t0-.07:1e9);
    return{el,spans,ws,a:ws[0].t0-.06,b:akhir};});}
function subFrame(t){if(!SUB.frasa.length)return;const c=SUB.cfg;SUB.frasa.forEach(f=>{const on=t>=f.a&&t<f.b;f.el.style.opacity=on?1:0;if(!on)return;
  let p=typeof c.y==='function'?c.y(t,f):{x:W/2,y:H*c.y};f.el.style.top=(p.y-f.el.offsetHeight/2)+'px';
  if(p.x!=null&&p.x!==W/2){f.el.style.left=(p.x-W/2)+'px';}else f.el.style.left='0px';
  f.spans.forEach((s,i)=>{const k=f.ws[i],m=E.back(seg(t,k.t0-.04,k.t0+.14));s.style.opacity=t<k.t0-.04?(c.gaya==='pil'?.35:0):1;s.style.transform=`translateY(${(1-m)*18}px) scale(${.86+.14*m})`;});});}
</script>
<script>
/* =====================================================================================
   APOTEK DIGITAL · gaya POP BERANI · adegan 1 (hook ±8 dtk)
   Semua gerak dihitung dari t di frame(t). Detik penting di WAKTU.
   ===================================================================================== */
const WAKTU={w0:.05,w1:.38,w2:.72,tarik:1.55,s0:2.15,s1:2.55,blk:2.9,keluar:3.65,kartu:3.95,buku:4.15,rak:5.0,vs:5.55,tanya:6.35,sapu:7.55,dur:8.2};
const NOTIF=[['!','Paracetamol habis','Rak 2 · baru ketahuan',''],['!','Amoxicillin hampir ED','Gudang · cek manual','k'],
  ['!','Selisih kas','Tutup shift kemarin',''],['!','Faktur PBF numpuk','Belum diinput','k'],['!','Antasida kosong','Pembeli balik kanan','']];
const T_NOT=[.0,.28,.56,.84,1.12];
const lay=$('#layar'),NEL=NOTIF.map(([i,a,b,k])=>{const e=mk('div','not',lay,`<div class="ic ${k}">${i}</div><div>${a}<small>${b}</small></div>`);return e;});
// ikon kecil kartu: buku & rak (CSS murni)
$('#ikBuku').innerHTML='<div class="abs" style="left:10px;top:8px;width:100px;height:76px;background:#3163D1;border:6px solid #1F2D3D;border-radius:10px"></div><div class="abs" style="left:57px;top:8px;width:6px;height:76px;background:#1F2D3D"></div>';
$('#ikRak').innerHTML='<div class="abs" style="left:4px;top:30px;width:112px;height:12px;background:#1F2D3D"></div><div class="abs" style="left:4px;top:80px;width:112px;height:12px;background:#1F2D3D"></div>'+
  '<div class="abs" style="left:14px;top:2px;width:24px;height:28px;background:#5DAD72;border:4px solid #1F2D3D"></div><div class="abs" style="left:78px;top:2px;width:24px;height:28px;background:#FFE14D;border:4px solid #1F2D3D"></div>'+
  '<div class="abs" style="left:44px;top:50px;width:26px;height:30px;border:4px dashed #FF4F64"></div>';

const st=(el,s)=>{for(const k in s)el.style[k]=s[k];};
// hentak: skala 3.2 -> 1 dalam .3 dtk + blur
function hentak(el,t,t0,keluar=99,rot=0){const k=seg(t,t0,t0+.3),o=seg(t,keluar,keluar+.22);
  if(t<t0||o>=1){el.style.opacity=0;return;}const s=lerp(3.2,1,E.out(k))*(1+.06*Math.sin(seg(t,t0+.3,t0+.6)*PI));
  st(el,{opacity:Math.min(1,k*3)*(1-o),filter:`blur(${(1-k)*14+o*10}px)`,transform:`translateY(${-o*80}px) rotate(${rot}deg) scale(${s})`});}
const PI=Math.PI;
// guncangan kamera: jumlah denyut di detik hentak
const GUNCANG=[[WAKTU.w0,10],[WAKTU.w1,14],[WAKTU.w2,10],[WAKTU.blk,10],[WAKTU.buku,8],[WAKTU.rak,16],[WAKTU.tanya,12]];
function guncang(t){let g=0;for(const[a,m]of GUNCANG){const u=t-a;if(u>0&&u<.35)g+=m*(1-u/.35);}return[Math.sin(t*93)*g,Math.cos(t*71)*g];}

function kamera(t){const tr=E.io(seg(t,WAKTU.tarik,WAKTU.tarik+.55));
  let z=lerp(1.72,1.0,tr),cx=lerp(560,540,tr),cy=lerp(1080,960,tr);
  z*=1+.025*seg(t,WAKTU.tarik+.55,WAKTU.dur);cx+=nz(t*.4,3)*6;cy+=nz(t*.4,8)*6;
  const[gx,gy]=guncang(t),bl=Math.sin(PI*seg(t,WAKTU.tarik,WAKTU.tarik+.55))*9;
  st($('#dunia'),{transform:`translate(${W/2+gx}px,${H/2+gy}px) scale(${z}) translate(${-cx}px,${-cy}px)`,filter:bl>.3?`blur(${bl}px)`:'none'});
  st($('#teks'),{transform:`translate(${gx*.6}px,${gy*.6}px)`});}

function latar(t){
  // blok warna berganti di ketukan
  const beat=[0,WAKTU.tarik,WAKTU.kartu,WAKTU.tanya],warna=['#3163D1','#2C5AAE','#3163D1','#1F2D3D'];let i=0;while(i<beat.length-1&&t>=beat[i+1])i++;
  $('#b1').style.background=warna[i];
  const ang=lerp(-14,-20,E.io(seg(t,WAKTU.kartu-.2,WAKTU.kartu+.3)))+Math.sin(t*.8)*1.2;
  const yb=lerp(1180,1360,E.io(seg(t,WAKTU.kartu-.2,WAKTU.kartu+.3)));
  st($('#b2'),{top:yb+'px',transform:`rotate(${ang}deg)`,background:t>=WAKTU.tanya?'#2C5AAE':'#4DA39A'});
  st($('#b3'),{top:(yb+260)+'px',transform:`rotate(${ang}deg)`});
  st($('#ring'),{left:(980+Math.sin(t*.7)*20)+'px',top:(260+Math.cos(t*.6)*20)+'px',transform:`rotate(${t*20}deg)`});
  $('#dots').style.backgroundPosition=`${t*20}px ${t*12}px`;}

function hp(t){const out=E.in(seg(t,WAKTU.keluar,WAKTU.kartu+.2)),getar=t<1.5?Math.sin(t*80)*1.6*Math.max(0,1-((t%.28)/.2)):0;
  st($('#hp'),{transform:`translateY(${out*1300}px) rotate(${8+getar+out*14}deg)`});
  let n=0;NEL.forEach((e,i)=>{const k=E.back(seg(t,T_NOT[i],T_NOT[i]+.32));if(t>=T_NOT[i])n++;
    // terbaru di atas: kartu lama turun ke bawah
    const pos=NEL.length-1-i,slot=T_NOT.filter(x=>x<=t).length-1-i;
    st(e,{top:(150+Math.max(0,slot)*148)+'px',opacity:t<T_NOT[i]?0:1,transform:`translateY(${(1-k)*-120}px) scale(${.85+.15*k})`});});
  $('#badge').textContent=n;}

function nota(t){
  const N=[['#n0',60,900,-16,-40,30],['#n1',90,1170,9,30,-25],['#n2',800,1280,-8,50,40],['#n3',-60,620,14,-50,-35]];
  N.forEach(([id,x,y,r,vx,vy],i)=>{const dt=t+i*.7,fx=x+vx*Math.sin(dt*.9)+ (t>WAKTU.kartu? (i%2?1:-1)*E.in(seg(t,WAKTU.kartu,WAKTU.kartu+.5))*1400:0);
    st($(id),{left:fx+'px',top:(y+vy*Math.sin(dt*1.1))+'px',transform:`rotate(${r+Math.sin(dt*1.3)*8}deg)`,opacity:(t>WAKTU.tarik-.2||i>1)&&t<WAKTU.kartu+.5?1:0});});}

function stiker(t){[['#s0',WAKTU.s0,740,700,12],['#s1',WAKTU.s1,80,1300,-8]].forEach(([id,t0,x,y,r])=>{const k=E.back(seg(t,t0,t0+.3)),o=seg(t,WAKTU.keluar,WAKTU.keluar+.25);
  st($(id),{left:x+'px',top:y+'px',opacity:t<t0||o>=1?0:1,transform:`rotate(${r+Math.sin(t*3)*3}deg) scale(${k*(1-o)})`});});}

function kartu(t){[['#kBuku',WAKTU.buku,-1],['#kRak',WAKTU.rak,1]].forEach(([id,t0,sd])=>{const k=E.back(seg(t,t0,t0+.35)),gt=id==='#kRak'?Math.sin(t*60)*6*Math.max(0,1-(t-t0-.3)/.6)*(t>t0+.3?1:0):0;
    const naik=seg(t,WAKTU.tanya-.1,WAKTU.tanya+.4);
    st($(id),{opacity:t<t0?0:1,transform:`translate(${(1-k)*sd*500+gt}px,${E.io(naik)*230}px) rotate(${sd*(1-k)*20+sd*2.5}deg) scale(${lerp(1,.8,E.io(naik))})`});});
  const kv=E.back(seg(t,WAKTU.vs,WAKTU.vs+.3)),naik=E.io(seg(t,WAKTU.tanya-.1,WAKTU.tanya+.4));
  st($('#vs'),{opacity:t<WAKTU.vs?0:1,transform:`translateY(${naik*200}px) rotate(${Math.sin(t*4)*8}deg) scale(${kv})`});}

function teks(t){hentak($('#w0'),t,WAKTU.w0,WAKTU.keluar,-2);hentak($('#w1'),t,WAKTU.w1,WAKTU.keluar+.05,-2);hentak($('#w2'),t,WAKTU.w2,WAKTU.keluar+.1,4);
  const kb=seg(t,WAKTU.blk,WAKTU.blk+.28),ob=seg(t,WAKTU.keluar+.1,WAKTU.keluar+.35);
  st($('#blk'),{opacity:t<WAKTU.blk||ob>=1?0:1,transform:`rotate(-3deg) scaleX(${E.out(kb)}) translateX(${-ob*900}px)`});
  const kt=E.back(seg(t,WAKTU.tanya,WAKTU.tanya+.35));st($('#tanya'),{opacity:t<WAKTU.tanya?0:1,transform:`scale(${lerp(2.6,1,E.out(seg(t,WAKTU.tanya,WAKTU.tanya+.3)))}) rotate(${-2+Math.sin(t*2)*1}deg)`,filter:`blur(${(1-seg(t,WAKTU.tanya,WAKTU.tanya+.3))*12}px)`});}

function sapu(t){const k=E.in(seg(t,WAKTU.sapu,WAKTU.dur));st($('#sapu'),{transform:`rotate(-14deg) translateY(${lerp(2300,-200,k)}px)`});}

const SCENE={
  dur:WAKTU.dur,
  kata:[{w:'Stok',t0:.1,t1:.35},{w:'habis',t0:.4,t1:.7},{w:'lagi?',t0:.74,t1:1.2},
        {w:'Di',t0:4.05,t1:4.15},{w:'buku',t0:4.15,t1:4.45},{w:'dua',t0:4.45,t1:4.65},{w:'puluh,',t0:4.65,t1:4.95},
        {w:'di',t0:5.0,t1:5.1},{w:'rak...',t0:5.1,t1:5.5},{w:'nol.',t0:5.65,t1:6.05},
        {w:'Masih',t0:6.4,t1:6.7},{w:'mau',t0:6.7,t1:6.85},{w:'catat',t0:6.85,t1:7.15},{w:'manual?',t0:7.15,t1:7.6}],
  sub:{gaya:'pil',font:"800 58px 'Plus Jakarta Sans'",warna:'#FFFFFF',aksen:'#FFE14D',kunci:['habis','nol','manual'],maks:3,y:.8},
  audio:{vo:[],sfx:[],music:null},
  muat(){return Promise.all([document.fonts.load("400 60px 'Bagel Fat One'"),document.fonts.load("800 30px 'Plus Jakarta Sans'"),document.fonts.load("600 30px 'Plus Jakarta Sans'")]);},
  frame(t){kamera(t);latar(t);hp(t);nota(t);stiker(t);kartu(t);teks(t);sapu(t);}
};
grainOn(.06);
</script>
<script>
/* ---------- boot: timeline, audio pratinjau, autoplay + loop, penggeser debug, API render ---------- */
(function(){
const DUR=SCENE.dur;const tl=gsap.timeline({paused:true});
if(SCENE.build)SCENE.build(tl);tl.set({},{},DUR);
window.AUDIO_PLAN=Object.assign({dur:DUR,vo:[],sfx:[],music:null,loops:[]},SCENE.audio||{});
subSiapkan(SCENE.kata||window.KATA,SCENE.sub);
const P=window.AUDIO_PLAN,EV=[];const A=src=>{const a=new Audio(src);a.preload='auto';return a;};
P.vo.forEach(v=>EV.push({at:v.at,el:A(v.src),vol:v.vol??1}));
if(P.music)EV.push({at:P.music.at||0,el:A(P.music.src),vol:Math.min(1,P.music.vol??.15),music:1});
P.sfx.forEach(s=>EV.push({at:s.at,el:A(s.src),vol:Math.min(1,s.vol??.5)}));
let live=false,lastT=0;const dbgOn=q.has('debug');
function frame(t){SCENE.frame&&SCENE.frame(t);subFrame(t);grainFrame(t);}
tl.eventCallback('onUpdate',()=>{const t=tl.time();frame(t);
  if(live&&!tl.paused())EV.forEach(e=>{if(e.at>=lastT&&e.at<t&&t-e.at<.25){e.el.volume=e.vol;e.el.currentTime=0;e.el.play().catch(()=>{});}});
  lastT=t;if(dbgOn){$('#dScrub').value=t/DUR*1000;$('#dClock').textContent=t.toFixed(2);}});
const stopAudio=()=>EV.forEach(e=>e.el.pause());
function start(){stopAudio();lastT=-1;live=true;tl.play(0);}
tl.eventCallback('onComplete',()=>start());
async function seek(t){live=false;tl.pause(t,true);frame(t);if(SCENE.siap)await SCENE.siap(t);}
window.MF={W,H,RASIO,DURATION:DUR,tl,ready:false,seek,play:start};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();if(tl.paused())tl.play();else{tl.pause();stopAudio();}}});
if(dbgOn){$('#dbg').style.display='flex';const sc=$('#dScrub');sc.addEventListener('input',()=>{live=false;stopAudio();tl.pause();tl.time(sc.value/1000*DUR);frame(tl.time());});$('#dPlay').onclick=()=>{if(tl.paused()){live=true;lastT=tl.time();tl.play();}else{tl.pause();stopAudio();}};}
const muatAwal=SCENE.muat?Promise.resolve(SCENE.muat()):Promise.resolve();
Promise.all([document.fonts.ready,muatAwal]).then(()=>new Promise(r=>setTimeout(r,80))).then(()=>{
  try{tl.pause(0,true);frame(0);}catch(err){__errs.push('frame(0): '+String(err&&err.stack||err));}window.MF.ready=true;
  if(q.has('t')){seek(parseFloat(q.get('t'))||0);return;}
  if(q.has('clean'))return;
  const probe=EV.find(e=>e.music)||EV[0];if(!probe){start();return;}
  probe.el.volume=0;probe.el.play().then(()=>{probe.el.pause();start();}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});
});
})();
</script>
