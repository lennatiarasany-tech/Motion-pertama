<script>
/* ================= MESIN MOTION FORMAT =================
   Aturan emas: semua gerak adalah fungsi dari waktu t (detik). Jangan pakai Date, performance.now,
   requestAnimationFrame, setTimeout, atau Math.random tanpa benih: render MP4 = lompat ke tiap frame. */
window.__errs=[];addEventListener('error',e=>__errs.push(String(e.message)));addEventListener('unhandledrejection',e=>__errs.push('Promise: '+String(e.reason&&e.reason.stack||e.reason)));
const W=1080,H=1920,RASIO='9:16',TEGAK=H>W,q=new URLSearchParams(location.search);
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();

/* ---------- matematika kecil ---------- */
const lerp=(a,b,k)=>a+(b-a)*k,clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const k=clamp((x-a)/(b-a));return k*k*(3-2*k);};
const seg=(t,a,b)=>clamp((t-a)/(b-a));                 // 0..1 di rentang [a,b]
const E={lin:k=>k,out:k=>1-Math.pow(1-k,3),in:k=>k*k*k,io:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  s:k=>k*k*(3-2*k),ox:k=>k>=1?1:1-Math.pow(2,-10*k),
  back:k=>{const c1=1.6,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2);},
  pegas:k=>k>=1?1:1-Math.exp(-6*k)*Math.cos(12*k)};
const nz=(t,s=0)=>Math.sin(t*1.31+s*7.13)*.5+Math.sin(t*2.71+s*3.37)*.3+Math.sin(t*.613+s*1.71)*.2; // goyang halus -1..1
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hash=n=>{const s=Math.sin(n*127.1+31.7)*43758.5453;return s-Math.floor(s);};

/* ---------- DOM & SVG ---------- */
function mk(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||$('#stage')).appendChild(e);return e;}
function svgEl(tag,attrs,parent){const e=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function kanvas(w=W,h=H,parent){const c=document.createElement('canvas');c.width=w;c.height=h;if(parent){c.style.cssText=`position:absolute;left:0;top:0;width:${w}px;height:${h}px`;parent.appendChild(c);}return c;}

/* ---------- teks per kata: masuk/keluar dengan blur berarah ---------- */
function split(el){const out=[];(function walk(n){[...n.childNodes].forEach(c=>{if(c.nodeType===3){const parts=c.textContent.split(/(\s+)/);const frag=document.createDocumentFragment();parts.forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){frag.appendChild(document.createTextNode(' '));return;}const wd=document.createElement('span');wd.className='wd';const wi=document.createElement('span');wi.className='wi';wi.textContent=p;wd.appendChild(wi);frag.appendChild(wd);out.push(wi);});c.replaceWith(frag);}else if(c.nodeType===1&&!c.classList.contains('wd'))walk(c);});})(el);return out;}
const W8=el=>el._w||(el._w=split(el));
function wIn(tl,el,at,o={}){const ws=W8(el);tl.set(el,{autoAlpha:1},at);tl.fromTo(ws,{yPercent:o.y??80,xPercent:o.x??0,opacity:0,filter:`blur(${o.b??12}px)`,scaleY:o.sy??1.25},{yPercent:0,xPercent:0,opacity:1,filter:'blur(0px)',scaleY:1,duration:o.d??.6,ease:o.ease??'power3.out',stagger:o.st??.07},at);return tl;}
function wOut(tl,el,at,o={}){const ws=W8(el);tl.to(ws,{yPercent:o.y??-70,xPercent:o.x??0,opacity:0,filter:`blur(${o.b??10}px)`,duration:o.d??.35,ease:'power2.in',stagger:o.st??.025},at);tl.set(el,{autoAlpha:0},at+(o.d??.35)+ws.length*(o.st??.025));return tl;}

/* ---------- butiran film ---------- */
function grainOn(opacity=.3,blend='overlay'){const c=kanvas(220,220),x=c.getContext('2d'),d=x.createImageData(220,220),r=rng(7);for(let i=0;i<d.data.length;i+=4){const v=r()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}x.putImageData(d,0,0);const g=$('#grain');g.style.backgroundImage=`url(${c.toDataURL()})`;g.style.opacity=opacity;g.style.mixBlendMode=blend;}
function grainFrame(t){const k=Math.floor(t*12);$('#grain').style.transform=`translate(${(k*37)%64-32}px,${(k*53)%64-32}px)`;}

/* ---------- zona aman: tempat teks penting boleh berada ---------- */
const AMAN=TEGAK?{atas:180,bawah:H-300,kiri:70,kanan:W-150}:{atas:70,bawah:H-90,kiri:110,kanan:W-110};

/* ---------- LABEL PENUNJUK: titik + garis + teks, tanpa kotak ----------
   const L=label({x:540,y:900,dx:180,dy:-160,teks:'pompa air',warna:'#FFD27A'});
   di frame(t): L.atur(t, muncul, hilang)            -> garis menggambar, teks masuk
   objek bergerak / 3D: L.atur(t, muncul, hilang, xLayar, yLayar)  -> titik ikut objek, sisi teks dijaga di zona aman */
function label(o){const g=svgEl('g',{opacity:0},$('#mfLab'));const w=o.warna||'#FFE7B0',fs=o.ukuran||(TEGAK?54:44);
  const halo=svgEl('circle',{r:22,fill:w,opacity:.25},g),dot=svgEl('circle',{r:8,fill:w},g);
  const ln=svgEl('polyline',{fill:'none',stroke:w,'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  const tt=svgEl('text',{fill:o.warnaTeks||'#FFFFFF','font-size':fs,'font-weight':o.tebal||800,style:'paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:10px;stroke-linejoin:round'},g);tt.textContent=o.teks;
  let len=0,kunci='';
  function tata(x,y){const kk=Math.round(x)+','+Math.round(y);if(kk===kunci)return;kunci=kk;
    const d0=Math.abs(o.dx??160),lebar=fs*.58*String(o.teks).length+56;
    const muatKanan=x+d0+lebar<=AMAN.kanan,muatKiri=x-d0-lebar>=AMAN.kiri;
    let kanan=(o.dx??160)>=0?(muatKanan||!muatKiri&&AMAN.kanan-x>=x-AMAN.kiri):!(muatKiri||!muatKanan&&x-AMAN.kiri>=AMAN.kanan-x);
    let tx=kanan?Math.min(x+d0,AMAN.kanan-lebar):Math.max(x-d0,AMAN.kiri+lebar);   // tak ada sisi lega: siku digeser ke dalam
    const ty=clamp(y+(o.dy??-140),AMAN.atas+fs,AMAN.bawah-fs);
    halo.setAttribute('cx',x);halo.setAttribute('cy',y);dot.setAttribute('cx',x);dot.setAttribute('cy',y);
    ln.setAttribute('points',`${x},${y} ${tx},${ty} ${tx+(kanan?40:-40)},${ty}`);len=Math.hypot(tx-x,ty-y)+40;ln.setAttribute('stroke-dasharray',len);
    tt.setAttribute('x',tx+(kanan?56:-56));tt.setAttribute('y',ty+fs*.35);tt.setAttribute('text-anchor',kanan?'start':'end');}
  tata(o.x??W/2,o.y??H/2);
  return{g,atur(t,a,b=1e9,x,y){if(!tt._f){tt._f=1;tt.setAttribute('font-family',o.font||(SUB.cfg?SUB.cfg.font.replace(/^.*?\d+px\s*/,''):'system-ui,sans-serif'));}
    if(x!=null)tata(x,y);const k=E.out(seg(t,a,a+.5)),h=1-seg(t,b,b+.3);g.setAttribute('opacity',Math.min(1,k*3)*h);
    ln.setAttribute('stroke-dashoffset',len*(1-k));tt.setAttribute('opacity',E.out(seg(t,a+.25,a+.6)));halo.setAttribute('r',22+8*Math.sin(t*4));}};}

const MFlabel=label;   // nama cadangan bila adegan memakai nama `label` sendiri

/* ---------- SUBTITLE dinamis per kata ----------
   Sumber kata: SCENE.kata, atau window.KATA dari kata.js (dibuat `mf.py kata`). Format [{w,t0,t1}] detik layar.
   SCENE.sub = { gaya:'polos'|'pil'|'mati', maks:4, y:0.68 (pecahan tinggi) atau fungsi(t,frasa)->{x,y},
                 font:"800 64px 'Plus Jakarta Sans'", warna:'#fff', aksen:'#FFB547', kunci:['kata','kunci'] } */
const SUB={frasa:[],cfg:null};
function subSiapkan(kata,cfg){SUB.cfg=Object.assign({gaya:'polos',maks:TEGAK?4:6,y:TEGAK?.68:.84,warna:'#FFFFFF',aksen:'#FFB547',kunci:[],
  font:`800 ${TEGAK?64:52}px system-ui,sans-serif`},cfg||{});if(!kata||!kata.length||SUB.cfg.gaya==='mati')return;
  const c=SUB.cfg,box=$('#mfSub');box.style.font=c.font;box.style.color=c.warna;
  if(c.gaya==='pil'){box.style.textShadow='none';}else{box.style.textShadow='0 2px 2px rgba(0,0,0,.9),0 0 14px rgba(0,0,0,.75),0 0 40px rgba(0,0,0,.5)';}
  const norm=w=>String(w).toLowerCase().replace(/[^\p{L}\p{N}]/gu,''),kunci=new Set(c.kunci.map(norm));let cur=[];
  const tutup=()=>{if(cur.length)SUB.frasa.push(cur);cur=[];};
  kata.forEach((k,i)=>{const prev=kata[i-1];if(cur.length&&(cur.length>=c.maks||/[.,!?;:…]$/.test(prev.w)||k.t0-prev.t1>.35))tutup();cur.push(k);});tutup();
  SUB.frasa=SUB.frasa.map((ws,i)=>{const el=mk('div','sf',box);el.style.cssText=`position:absolute;left:0;width:100%;opacity:0;padding:0 ${W-AMAN.kanan}px 0 ${AMAN.kiri}px`;
    const inner=c.gaya==='pil'?mk('span','',el):el;if(c.gaya==='pil')inner.style.cssText='display:inline-block;padding:.12em .5em .18em;border-radius:.6em;background:rgba(12,12,20,.72)';
    const spans=ws.map(k=>{const s=mk('span','sw',inner);s.textContent=k.w;if(kunci.has(norm(k.w)))s.style.color=c.aksen;return s;});
    const nxt=kata.indexOf(ws[ws.length-1])+1;const akhir=Math.min(ws[ws.length-1].t1+.35,kata[nxt]?kata[nxt].t0-.07:1e9);
    return{el,spans,ws,a:ws[0].t0-.06,b:akhir};});}
function subFrame(t){if(!SUB.frasa.length)return;const c=SUB.cfg;SUB.frasa.forEach(f=>{const on=t>=f.a&&t<f.b;f.el.style.opacity=on?1:0;if(!on)return;
  let p=typeof c.y==='function'?c.y(t,f):{x:W/2,y:H*c.y};f.el.style.top=(p.y-f.el.offsetHeight/2)+'px';
  if(p.x!=null&&p.x!==W/2){f.el.style.left=(p.x-W/2)+'px';}else f.el.style.left='0px';
  f.spans.forEach((s,i)=>{const k=f.ws[i],m=E.back(seg(t,k.t0-.04,k.t0+.14));s.style.opacity=t<k.t0-.04?(c.gaya==='pil'?.35:0):1;s.style.transform=`translateY(${(1-m)*18}px) scale(${.86+.14*m})`;});});}
</script>
<script>
/* ================= 1. ISI & WAKTU ================= */
const WAKTU = {hook: 0, tarik: 1.75, b2: 2.0, b3: 3.55, dur: 5.4};
const WARNA = {malam: '#0B1322', navy: '#16233A', dingin: '#8FB0D6', krem: '#F3EEE4', emas: '#D9B26A', merah: '#E5484D'};

const cv = kanvas(W, H, $('#dunia')), x = cv.getContext('2d');
const DP = $('#depan'), dx = DP.getContext('2d');
const VP = {x: 540, y: 820};

/* ================= 2. LATAR STATIS (dibuat sekali) ================= */
const BG = document.createElement('canvas'); BG.width = W; BG.height = H;
(function latar() {
  const g = BG.getContext('2d'), R = rng(7);
  // dinding & langit-langit
  let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0A111D'); gr.addColorStop(.45, '#142034'); gr.addColorStop(1, '#0A101B');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // dinding belakang
  g.fillStyle = '#1A2840'; g.fillRect(300, 520, 480, 580);
  // rak kiri & kanan (perspektif satu titik)
  function rak(sisi) {
    const P = (u, v) => { const xs = lerp(0, 300, u), top = lerp(170, 520, u), bot = lerp(1580, 1100, u);
      return [sisi < 0 ? xs : W - xs, lerp(top, bot, v)]; };
    const quad = (u0, u1, v0, v1, f) => { g.fillStyle = f; g.beginPath(); const a = P(u0, v0), b = P(u1, v0), c = P(u1, v1), d = P(u0, v1);
      g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.lineTo(...d); g.closePath(); g.fill(); };
    quad(0, 1, 0, 1, '#121C2C');
    const KOTAK = ['#E9EEF3', '#BFD4E8', '#9CC7A8', '#E7B58A', '#D98C8C', '#F2E3B3', '#A9B8E8', '#FFFFFF'];
    const lvl = [.08, .25, .42, .59, .76];
    lvl.forEach((lv, li) => {
      let u = 0;
      while (u < .98) {
        const du = (.05 + R() * .06) * (1 - u * .55), h = .05 + R() * .06;
        quad(u, Math.min(.99, u + du * .92), lv + .155 - h, lv + .155, KOTAK[Math.floor(R() * KOTAK.length)]);
        // label pada kotak
        if (R() < .7) quad(u + du * .15, u + du * .7, lv + .155 - h * .6, lv + .155 - h * .45, 'rgba(30,60,110,.55)');
        u += du;
      }
      quad(0, 1, lv + .155, lv + .175, '#2A3B57');
    });
    // gelapkan menurut kedalaman
    const p0 = P(0, 0), p1 = P(1, 0);
    const sh = g.createLinearGradient(p0[0], 0, p1[0], 0); sh.addColorStop(0, 'rgba(6,10,18,.25)'); sh.addColorStop(1, 'rgba(6,10,18,.72)');
    quad(0, 1, 0, 1, sh);
    // warna dingin menyeluruh
    quad(0, 1, 0, 1, 'rgba(40,70,120,.28)');
  }
  rak(-1); rak(1);
  // lantai
  g.fillStyle = '#101A29'; g.beginPath(); g.moveTo(0, 1580); g.lineTo(300, 1100); g.lineTo(780, 1100); g.lineTo(W, 1580); g.lineTo(W, H); g.lineTo(0, H); g.fill();
  g.strokeStyle = 'rgba(140,170,210,.10)'; g.lineWidth = 2;
  for (let i = -8; i <= 8; i++) { g.beginPath(); g.moveTo(540 + i * 30, 1100); g.lineTo(540 + i * 260, H); g.stroke(); }
  for (let i = 0; i < 12; i++) { const y = 1100 + Math.pow(i / 11, 2) * 820; g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // langit-langit
  g.fillStyle = '#0C1420'; g.beginPath(); g.moveTo(0, 0); g.lineTo(W, 0); g.lineTo(W, 170); g.lineTo(780, 520); g.lineTo(300, 520); g.lineTo(0, 170); g.fill();
  // bingkai etalase kaca di dinding belakang
  g.fillStyle = '#0E1726'; g.fillRect(350, 560, 380, 520);
})();

/* ================= 3. BAGIAN DINAMIS ================= */
const RR = rng(11);
const HUJAN = Array.from({length: 120}, () => ({x: 360 + RR() * 360, y: RR() * 520, v: 520 + RR() * 400, l: 12 + RR() * 22}));
const DEBU = Array.from({length: 70}, () => ({x: RR() * W, y: RR() * H, s: 1 + RR() * 3, v: 6 + RR() * 14, f: RR() * 6}));

function etalase(t) {
  // luar: jalan malam, hujan
  x.save(); x.beginPath(); x.rect(362, 572, 356, 496); x.clip();
  const g = x.createLinearGradient(0, 572, 0, 1068); g.addColorStop(0, '#2B4466'); g.addColorStop(.7, '#3E5C80'); g.addColorStop(1, '#22344F');
  x.fillStyle = g; x.fillRect(362, 572, 356, 496);
  // lampu jalan kabur
  [[420, 700, '#F3C77A'], [650, 660, '#9FC4F0'], [560, 760, '#F3C77A']].forEach(([lx, ly, c], i) => {
    const r = x.createRadialGradient(lx, ly, 0, lx, ly, 70); r.addColorStop(0, c); r.addColorStop(1, 'rgba(0,0,0,0)');
    x.globalAlpha = .45 + .1 * Math.sin(t * 2 + i); x.fillStyle = r; x.fillRect(lx - 70, ly - 70, 140, 140); });
  x.globalAlpha = 1;
  // orang lewat, tidak masuk
  const k = seg(t, 2.2, 5.4), px = lerp(330, 760, k);
  if (k > 0 && k < 1) {
    const bob = Math.abs(Math.sin(t * 7)) * 4;
    x.fillStyle = '#0E1828'; x.beginPath(); x.ellipse(px, 860 - bob, 14, 16, 0, 0, 7); x.fill();
    x.beginPath(); x.roundRect(px - 20, 876 - bob, 40, 92, 12); x.fill();
    x.fillRect(px - 15, 960 - bob, 11, 70 + Math.sin(t * 7) * 6); x.fillRect(px + 4, 960 - bob, 11, 70 - Math.sin(t * 7) * 6);
    // payung
    x.beginPath(); x.ellipse(px, 838 - bob, 46, 22, 0, Math.PI, 0); x.fill();
  }
  // hujan
  x.strokeStyle = 'rgba(190,215,245,.35)'; x.lineWidth = 1.5;
  HUJAN.forEach(h => { const y = 572 + ((h.y + t * h.v) % 520); x.beginPath(); x.moveTo(h.x, y); x.lineTo(h.x - 4, y + h.l); x.stroke(); });
  // pantulan kaca
  const sg = x.createLinearGradient(362, 572, 718, 1068); sg.addColorStop(.3, 'rgba(255,255,255,0)'); sg.addColorStop(.45, 'rgba(255,255,255,.08)'); sg.addColorStop(.55, 'rgba(255,255,255,0)');
  x.fillStyle = sg; x.fillRect(362, 572, 356, 496);
  x.restore();
  // rangka pintu & tanda BUKA
  x.strokeStyle = '#2A3B57'; x.lineWidth = 8; x.strokeRect(362, 572, 356, 496); x.beginPath(); x.moveTo(540, 572); x.lineTo(540, 1068); x.stroke();
  x.fillStyle = 'rgba(10,16,28,.85)'; x.beginPath(); x.roundRect(476, 640, 128, 46, 8); x.fill();
  x.fillStyle = '#9FE0B0'; x.font = "700 26px Onest"; x.textAlign = 'center'; x.fillText('BUKA', 540, 672);
}

function lampu(t) {
  // tabung neon di langit-langit, satu berkedip
  [0.15, .45, .75].forEach((d, i) => {
    const y = lerp(40, 500, d), w = lerp(300, 70, d), h = lerp(26, 6, d);
    let on = 1; if (i === 1) { const f = Math.sin(t * 31) + Math.sin(t * 17.3) + Math.sin(t * 5.1); on = f > 1.6 ? .15 : f > 1.2 ? .55 : 1; }
    x.fillStyle = `rgba(215,232,255,${.85 * on})`; x.beginPath(); x.roundRect(540 - w / 2, y, w, h, h / 2); x.fill();
    const r = x.createRadialGradient(540, y, 0, 540, y, w * 1.5); r.addColorStop(0, `rgba(150,190,240,${.22 * on})`); r.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = r; x.fillRect(540 - w * 1.5, y - w, w * 3, w * 2.5);
  });
}

function pantulanLantai() {
  const g = x.createLinearGradient(0, 1100, 0, 1420); g.addColorStop(0, 'rgba(110,150,200,.22)'); g.addColorStop(1, 'rgba(110,150,200,0)');
  x.fillStyle = g; x.beginPath(); x.moveTo(362, 1100); x.lineTo(718, 1100); x.lineTo(900, 1420); x.lineTo(180, 1420); x.fill();
}

/* grafik penjualan di layar monitor */
const MON = {x: 150, y: 930, w: 420, h: 280};
const TITIK = [.52, .60, .66, .64, .67, .63, .58, .50, .41, .30];
function monitor(t) {
  const {x: mx, y: my, w, h} = MON;
  // tiang & alas
  x.fillStyle = '#1C2638'; x.fillRect(mx + w / 2 - 16, my + h, 32, 50); x.beginPath(); x.ellipse(mx + w / 2, my + h + 52, 80, 12, 0, 0, 7); x.fill();
  // bodi
  x.fillStyle = '#0B111C'; x.beginPath(); x.roundRect(mx - 12, my - 12, w + 24, h + 24, 16); x.fill();
  // layar
  const g = x.createLinearGradient(mx, my, mx, my + h); g.addColorStop(0, '#13233D'); g.addColorStop(1, '#0D182B');
  x.fillStyle = g; x.beginPath(); x.roundRect(mx, my, w, h, 8); x.fill();
  x.save(); x.beginPath(); x.roundRect(mx, my, w, h, 8); x.clip();
  x.fillStyle = '#C9D7EA'; x.font = '600 19px Onest'; x.textAlign = 'left'; x.fillText('Penjualan', mx + 22, my + 36);
  x.fillStyle = '#6F86A8'; x.font = '500 13px Onest'; x.fillText('10 bulan terakhir', mx + 22, my + 56);
  // kisi
  const gx = mx + 30, gy = my + 80, gw = w - 60, gh = h - 120;
  x.strokeStyle = 'rgba(140,170,210,.14)'; x.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { x.beginPath(); x.moveTo(gx, gy + gh * i / 4); x.lineTo(gx + gw, gy + gh * i / 4); x.stroke(); }
  // garis tergambar mengikuti t
  const prog = (.3 + .35 * E.out(seg(t, 0, 1.3)) + .35 * E.io(seg(t, WAKTU.b2 + .2, WAKTU.b2 + 1.3))) * (TITIK.length - 1);
  const pt = i => [gx + gw * i / (TITIK.length - 1), gy + gh * (1 - TITIK[i])];
  const n = Math.floor(prog), fr = prog - n;
  let ujung = pt(0);
  // area
  x.beginPath(); x.moveTo(...pt(0));
  for (let i = 1; i <= n; i++) x.lineTo(...pt(i));
  if (n < TITIK.length - 1) { const a = pt(n), b = pt(n + 1); ujung = [lerp(a[0], b[0], fr), lerp(a[1], b[1], fr)]; x.lineTo(...ujung); } else ujung = pt(n);
  const turun = ujung[0] > pt(6)[0] + 4;
  x.lineWidth = 4; x.lineJoin = 'round'; x.strokeStyle = turun ? WARNA.merah : '#7FB0F0'; x.stroke();
  x.lineTo(ujung[0], gy + gh); x.lineTo(gx, gy + gh); x.closePath();
  const ag = x.createLinearGradient(0, gy, 0, gy + gh); ag.addColorStop(0, turun ? 'rgba(229,72,77,.28)' : 'rgba(127,176,240,.25)'); ag.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = ag; x.fill();
  // titik ujung berdenyut
  const p = .5 + .5 * Math.sin(t * 9);
  x.fillStyle = turun ? WARNA.merah : '#7FB0F0'; x.beginPath(); x.arc(ujung[0], ujung[1], 7 + p * 3, 0, 7); x.fill();
  x.globalAlpha = .35 * (1 - p); x.beginPath(); x.arc(ujung[0], ujung[1], 18 + p * 14, 0, 7); x.fill(); x.globalAlpha = 1;
  // lencana panah turun
  if (turun) { x.fillStyle = 'rgba(229,72,77,.18)'; x.beginPath(); x.roundRect(mx + w - 96, my + 20, 74, 34, 17); x.fill();
    x.fillStyle = WARNA.merah; x.beginPath(); x.moveTo(mx + w - 70, my + 30); x.lineTo(mx + w - 48, my + 30); x.lineTo(mx + w - 59, my + 46); x.fill(); }
  // bulan
  x.fillStyle = '#5E7598'; x.font = '500 12px Onest'; x.textAlign = 'center';
  ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt'].forEach((b, i) => x.fillText(b, gx + gw * i / 9, gy + gh + 22));
  // pantulan layar
  const sg = x.createLinearGradient(mx, my, mx + w, my + h); sg.addColorStop(.2, 'rgba(255,255,255,.07)'); sg.addColorStop(.35, 'rgba(255,255,255,0)');
  x.fillStyle = sg; x.fillRect(mx, my, w, h);
  x.restore();
  // cahaya layar ke sekitar
  const r = x.createRadialGradient(mx + w / 2, my + h / 2, 50, mx + w / 2, my + h / 2, 520);
  r.addColorStop(0, 'rgba(90,140,220,.20)'); r.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = r; x.fillRect(mx - 400, my - 400, w + 800, h + 800);
}

/* pemilik apotek: jas putih, tampak 3/4 belakang, menunduk, tangan menopang dahi */
function pemilik(t) {
  const napas = Math.sin(t * 1.6) * 2.5, tunduk = E.io(seg(t, 2.6, 3.8)) * 7 + nz(t * .4, 5) * 1.5;
  x.save(); x.translate(790, 1035 + napas); x.scale(1.15, 1.15);
  // badan: jas putih, diterangi layar dari kiri
  const jg = x.createLinearGradient(-150, 0, 150, 0); jg.addColorStop(0, '#B8C9E0'); jg.addColorStop(.4, '#6E82A6'); jg.addColorStop(1, '#222D44');
  x.fillStyle = jg; x.beginPath();
  x.moveTo(-150, 160); x.bezierCurveTo(-158, 70, -130, 22, -62, 8); x.quadraticCurveTo(0, -4, 64, 10);
  x.bezierCurveTo(130, 26, 150, 80, 152, 160); x.closePath(); x.fill();
  // lipatan & kerah
  x.strokeStyle = 'rgba(20,28,44,.55)'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(-22, 6); x.quadraticCurveTo(-30, 70, -12, 160); x.stroke();
  x.fillStyle = '#2A3550'; x.beginPath(); x.moveTo(-40, 4); x.lineTo(-18, 52); x.lineTo(6, 4); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(225,235,250,.6)'; x.lineWidth = 3; x.beginPath(); x.moveTo(-52, 6); x.lineTo(-24, 60); x.stroke();
  // leher
  x.fillStyle = '#1E2738'; x.beginPath(); x.roundRect(-34, -34, 44, 44, 10); x.fill();
  // kepala menunduk ke kiri (ke arah layar)
  x.save(); x.translate(-14, -30); x.rotate((-14 - tunduk) * Math.PI / 180);
  x.fillStyle = '#2B3549'; x.beginPath(); x.ellipse(-6, -58, 52, 60, 0, 0, 7); x.fill();
  // telinga
  x.fillStyle = '#334057'; x.beginPath(); x.ellipse(20, -52, 10, 16, 0, 0, 7); x.fill();
  // rambut (atas & belakang)
  x.fillStyle = '#0C1019'; x.beginPath();
  x.moveTo(-58, -70); x.bezierCurveTo(-58, -128, 46, -132, 52, -64); x.bezierCurveTo(54, -36, 44, -20, 34, -14);
  x.lineTo(30, -46); x.bezierCurveTo(10, -78, -30, -84, -58, -70); x.fill();
  // garis cahaya layar di dahi/pipi
  x.strokeStyle = 'rgba(140,190,255,.8)'; x.lineWidth = 3.5; x.beginPath(); x.ellipse(-6, -58, 52, 60, 0, Math.PI * .62, Math.PI * 1.12); x.stroke();
  // kacamata
  x.strokeStyle = 'rgba(190,215,250,.7)'; x.lineWidth = 3; x.beginPath(); x.moveTo(-58, -48); x.lineTo(14, -54); x.stroke();
  x.restore();
  // lengan kiri: siku bertumpu di meja, telapak di dahi
  const hy = -112 + tunduk * 1.4;
  const ag = x.createLinearGradient(-200, 0, -40, 0); ag.addColorStop(0, '#C3D2E6'); ag.addColorStop(1, '#7488AC');
  x.strokeStyle = ag; x.lineCap = 'round'; x.lineJoin = 'round';
  x.lineWidth = 44; x.beginPath(); x.moveTo(-118, 40); x.quadraticCurveTo(-160, 110, -140, 152); x.stroke();
  x.lineWidth = 38; x.beginPath(); x.moveTo(-140, 152); x.lineTo(-92, hy + 34); x.stroke();
  // manset & tangan
  x.fillStyle = '#E6EDF6'; x.save(); x.translate(-96, hy + 40); x.rotate(-.35); x.fillRect(-21, -8, 42, 14); x.restore();
  x.fillStyle = '#3A4660'; x.beginPath(); x.ellipse(-82, hy + 6, 24, 34, -.35, 0, 7); x.fill();
  x.strokeStyle = 'rgba(160,205,255,.7)'; x.lineWidth = 3; x.beginPath(); x.ellipse(-82, hy + 6, 24, 34, -.35, Math.PI * .55, Math.PI * 1.25); x.stroke();
  // jari
  x.strokeStyle = '#3A4660'; x.lineWidth = 9;
  [[-96, -24], [-86, -28], [-76, -26]].forEach(([fx, fy]) => { x.beginPath(); x.moveTo(fx, hy + 2); x.lineTo(fx + 8, hy + fy); x.stroke(); });
  x.restore();
}

/* lapisan depan kabur: rak display kaca di sudut bawah */
const KDEP = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), R = rng(23);
  g.filter = 'blur(10px)';
  const KT = ['#DDE6F2', '#9FC0E2', '#8FC4A0', '#E2B184', '#C98A8A', '#F0E2B0'];
  [[-40, 1640, 330], [800, 1690, 320]].forEach(([ox, oy, w]) => {
    g.fillStyle = 'rgba(12,20,34,.95)'; g.fillRect(ox, oy + 120, w, 400);
    for (let i = 0; i < 7; i++) { const bw = 50 + R() * 40, bh = 70 + R() * 60, bx = ox + 10 + i * (w / 7);
      g.fillStyle = KT[i % KT.length]; g.globalAlpha = .55; g.fillRect(bx, oy + 120 - bh, bw, bh); }
    g.globalAlpha = .35; g.fillStyle = '#D9B26A'; g.fillRect(ox, oy + 118, w, 6); g.globalAlpha = 1;
  });
  return c; })();

function konter(t) {
  // permukaan atas
  const tg = x.createLinearGradient(0, 1205, 0, 1240); tg.addColorStop(0, '#3A4A66'); tg.addColorStop(1, '#202C42');
  x.fillStyle = tg; x.beginPath(); x.moveTo(90, 1240); x.lineTo(150, 1205); x.lineTo(930, 1205); x.lineTo(990, 1240); x.fill();
  // garis emas tipis
  x.fillStyle = 'rgba(217,178,106,.55)'; x.fillRect(90, 1240, 900, 4);
  // muka konter
  const fg = x.createLinearGradient(0, 1244, 0, 1600); fg.addColorStop(0, '#16223A'); fg.addColorStop(1, '#0B1322');
  x.fillStyle = fg; x.fillRect(90, 1244, 900, 360);
  // panel vertikal
  x.strokeStyle = 'rgba(140,170,210,.08)'; x.lineWidth = 2;
  for (let i = 1; i < 6; i++) { x.beginPath(); x.moveTo(90 + i * 150, 1250); x.lineTo(90 + i * 150, 1600); x.stroke(); }
  // logo palang apotek redup di muka konter
  x.fillStyle = 'rgba(120,200,150,.16)'; x.fillRect(522, 1350, 36, 110); x.fillRect(485, 1387, 110, 36);
  // barang di meja: botol & kantong obat
  x.fillStyle = '#C9D6E6'; x.beginPath(); x.roundRect(612, 1150, 34, 60, 6); x.fill();
  x.fillStyle = '#3E8E5A'; x.fillRect(612, 1170, 34, 18);
  x.fillStyle = '#DCE5F0'; x.beginPath(); x.moveTo(660, 1208); x.lineTo(672, 1160); x.lineTo(720, 1160); x.lineTo(732, 1208); x.fill();
}

function debu(t) {
  DEBU.forEach(d => { const y = (d.y - t * d.v + H) % H, xx = d.x + Math.sin(t * .6 + d.f) * 14;
    x.globalAlpha = .18 + .2 * Math.sin(t * 1.3 + d.f); x.fillStyle = '#CFE0F5'; x.beginPath(); x.arc(xx, y, d.s, 0, 7); x.fill(); });
  x.globalAlpha = 1;
}

let KDX = 0;
function vinyet() {
  dx.clearRect(0, 0, W, H);
  dx.drawImage(KDEP, KDX, 0);
  const r = dx.createRadialGradient(W / 2, H * .55, H * .25, W / 2, H * .55, H * .78);
  r.addColorStop(0, 'rgba(0,0,0,0)'); r.addColorStop(1, 'rgba(3,6,12,.82)');
  dx.fillStyle = r; dx.fillRect(0, 0, W, H);
  // gradasi atas supaya teks terbaca
  const g = dx.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, 'rgba(5,9,18,.75)'); g.addColorStop(1, 'rgba(5,9,18,0)');
  dx.fillStyle = g; dx.fillRect(0, 0, W, 760);
}

/* ================= 4. KAMERA ================= */
function kamera(t) {
  const k = E.io(seg(t, WAKTU.tarik, WAKTU.tarik + .7));
  // hook: dekat di grafik, sudah merayap; lalu tarik mundur, lalu push-in pelan
  const s0 = 2.15 + .12 * seg(t, 0, WAKTU.tarik), s1 = 1.08 + .08 * E.io(seg(t, WAKTU.tarik + .7, WAKTU.dur));
  const s = lerp(s0, s1, k);
  const fx = lerp(MON.x + MON.w / 2 + 20, 560, k), fy = lerp(MON.y + MON.h / 2, 1010 - 20 * seg(t, 2.5, 5.4), k);
  const sx = lerp(540, 540, k), sy = lerp(1080, 1000, k);
  const gx = nz(t * .35, 1) * 7 + Math.sin(t * 40) * 6 * Math.max(0, 1 - Math.abs(t - .55) / .18);
  const gy = nz(t * .35, 2) * 6;
  const tx = sx - s * fx + gx, ty = sy - s * fy + gy;
  const D = $('#dunia');
  D.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
  D.style.filter = `blur(${(Math.sin(Math.PI * k) * 9).toFixed(2)}px) saturate(.8) brightness(.95)`;
}

/* ================= 5. SCENE ================= */
const B1 = $('#b1'), B2 = $('#b2'), B3 = $('#b3');
[B1, B2, B3].forEach(b => b.style.top = (AMAN.atas + 70) + 'px');

const SCENE = {
  dur: WAKTU.dur,
  kata: [],
  sub: {gaya: 'mati'},
  audio: {vo: [], sfx: [], music: null},
  build(tl) {
    wIn(tl, B1, WAKTU.hook + .05, {st: .09});
    wOut(tl, B1, WAKTU.tarik - .3);
    wIn(tl, B2, WAKTU.b2, {st: .1});
    wOut(tl, B2, WAKTU.b3 - .35);
    wIn(tl, B3, WAKTU.b3, {st: .12});
  },
  frame(t) {
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.drawImage(BG, 0, 0);
    etalase(t); lampu(t); pantulanLantai();
    pemilik(t); konter(t); monitor(t); debu(t);
    kamera(t); KDX = nz(t * .3, 9) * 14 - 30 * E.io(seg(t, WAKTU.tarik, WAKTU.dur)); vinyet();
    // garis emas di bawah kata kunci
    B1.querySelector('em').style.setProperty('--g', E.out(seg(t, .5, 1.0)));
    B2.querySelector('em').style.setProperty('--g', E.out(seg(t, WAKTU.b2 + .45, WAKTU.b2 + .95)));
    B3.querySelector('em').style.setProperty('--g', E.out(seg(t, WAKTU.b3 + .45, WAKTU.b3 + .95)));
  }
};
</script>
<script>
/* ---------- boot: timeline, audio pratinjau, autoplay + loop, penggeser debug, API render ---------- */
(function(){
const DUR=SCENE.dur;const tl=gsap.timeline({paused:true});
if(SCENE.build)SCENE.build(tl);tl.set({},{},DUR);
window.AUDIO_PLAN=Object.assign({dur:DUR,vo:[],sfx:[],music:null,loops:[]},SCENE.audio||{});
subSiapkan(SCENE.kata||window.KATA,SCENE.sub);
const P=window.AUDIO_PLAN,EV=[];const A=src=>{const a=new Audio(src);a.preload='auto';return a;};
P.vo.forEach(v=>EV.push({at:v.at,el:A(v.src),vol:v.vol??1}));
if(P.music)EV.push({at:P.music.at||0,el:A(P.music.src),vol:Math.min(1,P.music.vol??.15),music:1});
P.sfx.forEach(s=>EV.push({at:s.at,el:A(s.src),vol:Math.min(1,s.vol??.5)}));
let live=false,lastT=0;const dbgOn=q.has('debug');
function frame(t){SCENE.frame&&SCENE.frame(t);subFrame(t);grainFrame(t);}
tl.eventCallback('onUpdate',()=>{const t=tl.time();frame(t);
  if(live&&!tl.paused())EV.forEach(e=>{if(e.at>=lastT&&e.at<t&&t-e.at<.25){e.el.volume=e.vol;e.el.currentTime=0;e.el.play().catch(()=>{});}});
  lastT=t;if(dbgOn){$('#dScrub').value=t/DUR*1000;$('#dClock').textContent=t.toFixed(2);}});
const stopAudio=()=>EV.forEach(e=>e.el.pause());
function start(){stopAudio();lastT=-1;live=true;tl.play(0);}
tl.eventCallback('onComplete',()=>start());
async function seek(t){live=false;tl.pause(t,true);frame(t);if(SCENE.siap)await SCENE.siap(t);}
window.MF={W,H,RASIO,DURATION:DUR,tl,ready:false,seek,play:start};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();if(tl.paused())tl.play();else{tl.pause();stopAudio();}}});
if(dbgOn){$('#dbg').style.display='flex';const sc=$('#dScrub');sc.addEventListener('input',()=>{live=false;stopAudio();tl.pause();tl.time(sc.value/1000*DUR);frame(tl.time());});$('#dPlay').onclick=()=>{if(tl.paused()){live=true;lastT=tl.time();tl.play();}else{tl.pause();stopAudio();}};}
const muatAwal=SCENE.muat?Promise.resolve(SCENE.muat()):Promise.resolve();
Promise.all([document.fonts.ready,muatAwal]).then(()=>new Promise(r=>setTimeout(r,80))).then(()=>{
  try{tl.pause(0,true);frame(0);}catch(err){__errs.push('frame(0): '+String(err&&err.stack||err));}window.MF.ready=true;
  if(q.has('t')){seek(parseFloat(q.get('t'))||0);return;}
  if(q.has('clean'))return;
  const probe=EV.find(e=>e.music)||EV[0];if(!probe){start();return;}
  probe.el.volume=0;probe.el.play().then(()=>{probe.el.pause();start();}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);start();};addEventListener('pointerdown',go);addEventListener('keydown',go);});
});
})();
</script>
