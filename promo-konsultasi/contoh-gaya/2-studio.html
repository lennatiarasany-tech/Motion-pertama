<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(90% 55% at 50% 42%,#1A2A44 0%,#0A1120 60%,#04070D 100%)}
#dunia{position:absolute;inset:0}
.t{position:absolute;left:0;width:100%;text-align:center}
.k1{top:240px;font:600 44px Onest;letter-spacing:.2em;color:#9FB3CF}
.k2{top:300px;font:400 168px/1 'Instrument Serif';color:#F3EEE4;text-shadow:0 0 50px rgba(0,0,0,.8)}
.k2 em{color:#D9B26A}
.garis{position:absolute;top:500px;left:390px;width:300px;height:3px;background:linear-gradient(90deg,transparent,#D9B26A,transparent)}
.nama{position:absolute;bottom:120px;left:0;width:100%;text-align:center;font:600 30px Onest;color:#6F84A6;letter-spacing:.2em}
#vin{position:absolute;inset:0;background:radial-gradient(75% 60% at 50% 50%,transparent 55%,rgba(0,0,0,.7) 100%)}
</style></head><body>
<div id="stage"><div id="dunia"></div><div id="vin"></div>
<div class="t k1">PENJUALAN APOTEKMU</div>
<div class="t k2">Makin <em>turun?</em></div><div class="garis"></div>
<div class="nama">GAYA 2 · 3D SINEMATIK STUDIO</div>
</div>
<script src="three.min.js"></script><script src="umum.js"></script>
<script>
const {ren, sc} = siapkan(true); ren.toneMappingExposure = 1.1;
sc.fog = new THREE.FogExp2(lin("#0A1120"), .025);
const cam = new THREE.PerspectiveCamera(34, W / H, .1, 100); cam.position.set(0, 2.6, 13); cam.lookAt(0, 1.4, 0);
sc.add(new THREE.HemisphereLight(lin('#5D7BA8'), lin('#05080F'), .35));
// sorot utama dari atas (dingin)
const sp = new THREE.SpotLight(lin('#BFD6FF'), 5, 30, .42, .6, 1); sp.position.set(0, 12, 2); sp.target.position.set(0, 0, 0); sp.castShadow = true; sp.shadow.mapSize.set(2048, 2048); sc.add(sp, sp.target);
const rim = new THREE.DirectionalLight(lin('#D9B26A'), .9); rim.position.set(-6, 3, -6); sc.add(rim);
const rim2 = new THREE.PointLight(lin('#E5484D'), 2.2, 9); rim2.position.set(1.2, 1.4, -1.2); /* tanpa lampu merah */
// lantai mengilap
const lantai = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({color: lin('#0B1322'), roughness: .22, metalness: .6}));
lantai.rotation.x = -Math.PI / 2; lantai.receiveShadow = true; sc.add(lantai);
// podium
const pod = mesh(new THREE.CylinderGeometry(2.6, 2.7, .35, 96), mat('#16223A', {roughness: .3, metalness: .5}), 0, .175, 0); sc.add(pod);
const cincin = mesh(new THREE.TorusGeometry(2.62, .025, 8, 128), new THREE.MeshBasicMaterial({color: lin('#D9B26A')}), 0, .35, 0); cincin.rotation.x = Math.PI / 2; sc.add(cincin);
// grafik batang kaca di podium, turun merah
[1.9, 2.3, 2.1, 1.5, 1.0, .55].forEach((h, i) => {
  const red = i > 2;
  const b = rbox(.42, h, .42, .06, new THREE.MeshPhysicalMaterial({color: lin(red ? '#E5484D' : '#7FA6DA'), roughness: .15, metalness: .1, transmission: 0, clearcoat: 1, emissive: lin(red ? '#5A0E12' : '#0E2240'), emissiveIntensity: red ? .9 : .5}));
  b.position.set(-1.35 + i * .54, .35 + h / 2, 0); sc.add(b);
});
// panah turun 3D
const ps = new THREE.Shape(); ps.moveTo(-.12, .5); ps.lineTo(.12, .5); ps.lineTo(.12, 0); ps.lineTo(.3, 0); ps.lineTo(0, -.4); ps.lineTo(-.3, 0); ps.lineTo(-.12, 0);
const pa = new THREE.Mesh(new THREE.ExtrudeGeometry(ps, {depth: .12, bevelEnabled: true, bevelSize: .02, bevelThickness: .02}), mat('#E5484D', {emissive: lin('#7A1418'), roughness: .25}));
pa.position.set(1.85, 3.0, 0); pa.rotation.z = .5; sc.add(pa);
// palang apotek melayang (kaca hijau)
const cs = new THREE.Shape(); const a = .32, b = .95;
cs.moveTo(-a, b); cs.lineTo(a, b); cs.lineTo(a, a); cs.lineTo(b, a); cs.lineTo(b, -a); cs.lineTo(a, -a); cs.lineTo(a, -b); cs.lineTo(-a, -b); cs.lineTo(-a, -a); cs.lineTo(-b, -a); cs.lineTo(-b, a); cs.lineTo(-a, a);
const cross = new THREE.Mesh(new THREE.ExtrudeGeometry(cs, {depth: .3, bevelEnabled: true, bevelSize: .06, bevelThickness: .06, bevelSegments: 4}),
  new THREE.MeshPhysicalMaterial({color: lin('#2FAE5B'), roughness: .2, clearcoat: 1, emissive: lin('#0B3A1B'), emissiveIntensity: .6}));
cross.position.set(-2.6, 4.6, -1.5); cross.rotation.set(.2, .6, -.15); cross.castShadow = true; sc.add(cross);
// botol & kotak obat melayang
const botol = new THREE.Group();
botol.add(mesh(new THREE.CylinderGeometry(.32, .32, .9, 48), new THREE.MeshPhysicalMaterial({color: lin("#8A5A2B"), roughness: .15, clearcoat: 1})));
botol.add(mesh(new THREE.CylinderGeometry(.34, .34, .25, 48), mat('#F3EEE4', {roughness: .4}), 0, .55, 0));
const lab = mesh(new THREE.CylinderGeometry(.325, .325, .4, 48, 1, true), mat('#F3EEE4')); botol.add(lab);
botol.position.set(2.7, 4.9, -1); botol.rotation.set(.3, 0, .5); sc.add(botol);
const kotak = rbox(.9, 1.2, .4, .05, mat('#E9EEF5', {roughness: .5})); kotak.position.set(-2.3, 2.1, 1.6); kotak.rotation.set(-.2, .7, .25); sc.add(kotak);
const kl = rbox(.92, .25, .42, .02, mat('#1F57B5')); kl.position.copy(kotak.position); kl.rotation.copy(kotak.rotation); sc.add(kl);
// kapsul
function kapsul(x, y, z, rz, c1, c2) { const g = new THREE.Group();
  const s1 = mesh(new THREE.CylinderGeometry(.13, .13, .26, 32), mat(c1, {roughness: .2})); s1.position.y = .13; g.add(s1);
  g.add(mesh(new THREE.SphereGeometry(.13, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), mat(c1, {roughness: .2}), 0, .26, 0));
  const s2 = mesh(new THREE.CylinderGeometry(.13, .13, .26, 32), mat(c2, {roughness: .2})); s2.position.y = -.13; g.add(s2);
  g.add(mesh(new THREE.SphereGeometry(.13, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), mat(c2, {roughness: .2}), 0, -.26, 0));
  g.position.set(x, y, z); g.rotation.z = rz; sc.add(g); }
kapsul(1.4, 5.6, 1, .8, '#D9B26A', '#F3EEE4'); kapsul(-1.2, 6.2, 0, -.5, '#E5484D', '#F3EEE4'); kapsul(3.0, 2.0, 2.2, 1.2, '#1F57B5', '#F3EEE4');
// kerucut cahaya (volumetrik palsu)
const kc = new THREE.Mesh(new THREE.ConeGeometry(3.6, 12, 64, 1, true), new THREE.MeshBasicMaterial({color: lin('#9FC0F0'), transparent: true, opacity: .06, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending}));
kc.position.set(0, 6, 1); sc.add(kc);
// debu
const R = rng(5), pts = []; for (let i = 0; i < 400; i++) pts.push((R() - .5) * 7, R() * 9, (R() - .5) * 5);
const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
sc.add(new THREE.Points(dg, new THREE.PointsMaterial({color: lin('#CFE0F5'), size: .03, transparent: true, opacity: .6})));
cam.position.set(0, 4.2, 21); cam.lookAt(0, 3.3, 0);
ren.render(sc, cam);
siapFont().then(() => { ren.render(sc, cam); window.SIAP = true; });
</script></body></html>
