<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

h1{font-size:16px;margin:4px 0 8px;font-weight:700;text-align:center}

.row{display:flex;gap:8px;flex-wrap:wrap}

.main{background:#e0453a}.on{background:#3a8d5c}
input[type=range]{width:100%;accent-color:#e0453a}
#status{font-size:13px;color:#b9b4c6;min-height:1.4em;text-align:center}
#out{display:none;flex-direction:column;gap:8px}#out video{width:100%;border-radius:12px;background:#000}

#prompter p{font-size:23px;line-height:1.5;margin:0 0 16px}
#prompter .hint{font-size:14px;color:#ff8a80}
#bStop{position:fixed;left:20px;right:20px;bottom:20px;background:#e0453a;font-size:17px;padding:16px}

sfx('tap', 1, 0); sfx('tap', 1, 0, .22); sfx('tap', 1, 0, .44); sfx('tap', 1, 0, .66); sfx('sparkle', 1, 3);
// 3. Dodi mengamati strip obat
scene({ s: 2, draw(ctx, lt, t) {
  const hh = handheld(t, 3), cam = { x: 540 + hh[0], y: 960 + hh[1], z: 1.05 + lt * .05 };
  apotek(ctx, t, cam);
  drawDodi(ctx, { x: 540, y: 1640, s: 860, t, pose: 'hold', face: { e: 'half', b: 'one', m: 'hmm' }, look: [.1, .7], tilt: Math.sin(lt * 2) * .04, talk: bicara('D', t), hold: stripKecil, holdHand: 'R' });
  icon(ctx, 'q', 820, 620 + Math.sin(t * 3) * 12, 1.2 * popIn(t, T(2, 1)), t);
} });
sfx('swish', 2, 1);
// 4. strip dibolak-balik: polos di dua sisi
scene({ s: 3, draw(ctx, lt, t) {
  const hh = handheld(t, 3), cam = { x: 540 + hh[0], y: 960 + hh[1], z: 1 };
  apotek(ctx, t, cam);
  const putar = inv(T(3, 0), T(3, 2), t), fx = Math.cos(putar * TAU * 1.5);
  stripBesar(ctx, 540, 640, 330, Math.abs(fx) < .06 ? .06 : fx, Math.sin(t * 2) * .05);
  const k = popIn(t, T(3, 3)); if (k > 0) { ctx.save(); ctx.translate(820, 440); ctx.rotate(.2); ctx.scale(k, k); icon(ctx, 'cross', 0, 0, 1.1, t); ctx.restore(); }
  const ang = t > T(3, 2);
  drawDodi(ctx, { x: 540, y: 1570, s: 600, t, pose: ang ? 'shrug' : 'explain', face: ang ? 'worried' : 'think', look: [0, -.8], talk: bicara('D', t) });
  if (ang) sweat(ctx, 700, 1070, 34, 1);
} });
sfx('swish', 3, 0); sfx('swish', 3, 1); sfx('buzz', 3, 3, 0, .6);
// 5. kamera naik: rak penuh ribuan obat
scene({ s: 4, draw(ctx, lt, t, d) {
  const z = lerp(1.15, .86, ease(clamp(lt / d))), sh = t > T(4, 4) ? shake(t, 10 * (1 - inv(T(4, 4), T(4, 4) + .5, t)), 2) : [0, 0];
  const cam = { x: 540 + sh[0], y: 960 + sh[1], z };
  CAM(ctx, cam, .05); sky(ctx, '#d6f3ec', '#bfe7dc');
  CAM(ctx, cam, 1);
  const pop = t < T(4, 4) ? 1 : 1;
  for (let c = -1; c <= 2; c++) rakObat(ctx, -420 + c * 640, -250, 600, 10, 160, 40 + c, t, pop);
  ctx.save(); screen(ctx); const g = ctx.createLinearGradient(0, 1300, 0, 1920); g.addColorStop(0, 'rgba(214,243,236,0)'); g.addColorStop(1, 'rgba(214,243,236,.9)'); ctx.fillStyle = g; ctx.fillRect(0, 1300, W, 620); ctx.restore();
  CAM(ctx, cam, 1);
  drawDodi(ctx, { x: 540, y: 1380, s: 380, t, pose: 'shock', face: 'wow', look: [0, -1], talk: bicara('D', t) });
  if (t > T(4, 4)) { const k = inv(T(4, 4), T(4, 4) + .35, t); speedLines(ctx, t, 1 - k * .5); flash(ctx, (1 - k) * .5); }
} });
sfx('rise', 4, 0, 0, .7); sfx('impact', 4, 4);
// 6. nenek santai: "yang putih, bulet"
scene({ s: 5, draw(ctx, lt, t) {
  const hh = handheld(t, 3), cam = { x: 540 + hh[0], y: 960 + hh[1], z: 1.08 - lt * .03 };
  apotek(ctx, t, cam);
  nenek(ctx, { x: 540, y: 1640, s: 860, t, pose: 'explain', face: t > T(5, 2) ? 'laugh' : 'happy', look: [0, -.1], talk: bicara('N', t), tilt: Math.sin(t * 3) * .05, hold: stripKecil });
  for (let i = 0; i < 5; i++) sparkle(ctx, 200 + i * 170, 520 + Math.sin(i * 2.1) * 120, 34 * popIn(t, T(5, 1) + i * .06) * (.6 + .4 * Math.sin(t * 6 + i)), 1);
} });
sfx('sparkle', 5, 1);
// 7. Dodi panik: semua obat putih dan bulet
scene({ s: 6, draw(ctx, lt, t) {
  const kej = popIn(t, T(6, 0), .3), sh = shake(t, 12 * clamp(1.2 - lt), 2), cam = { x: 540 + sh[0], y: 960 + sh[1], z: 1 + .12 * kej };
  apotek(ctx, t, cam);
  burst(ctx, 540, 640, 520 * kej, 14, '#ffe24a');
  if (t > T(6, 4)) { const R = rng(21); for (let i = 0; i < 26; i++) { const x = R() * 1080, sp = 700 + R() * 600, y = -120 + ((t - T(6, 4)) * sp + R() * 300) % 1700, r = 28 + R() * 26;
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 3 + i); circle(ctx, 0, 0, r); fs(ctx, '#ffffff', 5); line(ctx, -r * .6, 0, r * .6, 0, 5, '#c3ccd8'); ctx.restore(); } }
  drawDodi(ctx, { x: 540, y: 1640, s: 860, t, pose: 'shock', face: 'scared', look: [Math.sin(t * 20) * .5, -.2], talk: bicara('D', t) });
  sweat(ctx, 760, 820, 46, 1); sweat(ctx, 330, 900, 34, clamp((lt - .3) * 3));
  speedLines(ctx, t, .7);
} });
sfx('impact', 6, 0); sfx('thud', 6, 4); sfx('swish', 6, 6);
// 8. penutup: nenek santai, Dodi tepok jidat
scene({ s: 7, tr: 'cut', draw(ctx, lt, t, d) {
  const hh = handheld(t, 3), cam = { x: 540 + hh[0], y: 960 + hh[1], z: 1.06 + easeOut(clamp(lt / d)) * .06 };
  apotek(ctx, t, cam);
  const tepok = t > T(7, 3);
  drawDodi(ctx, { x: 320, y: 1570, s: 600, t, pose: tepok ? 'facepalm' : 'shock', face: tepok ? { e: 'closed', b: 'worry', m: 'wobble' } : 'shock', talk: bicara('D', t) });
  if (tepok) sweat(ctx, 450, 1080, 30, 1);
  meja(ctx);
  nenek(ctx, { x: 790, y: 1530, s: 520, t, pose: 'wave', flip: -1, face: 'laugh', talk: bicara('N', t) });
} });
sfx('tap', 7, 3, 0, 1.2); sfx('ding', 7, -1, .4, .8);
